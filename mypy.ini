# mypy config — INFORMATIONAL type checking (soft gate, per user 2026-09-05).
# Non-strict + ignore-missing-imports so it surfaces real type errors on annotated code without
# blocking the largely-unannotated existing codebase. Runs as a warn-only pre-commit hook and can be
# tightened over time (add per-module `strict` sections as modules get annotated).
[mypy]
ignore_missing_imports = True
check_untyped_defs = False
warn_unused_ignores = False
warn_return_any = False
follow_imports = silent
# vendored / generated / data / experimental trees are out of scope (mirrors the lint excludes)
exclude = (?x)(^archive/|^data/|^\.venv|^temp|^_research|^_master_ref|/__pycache__/)
